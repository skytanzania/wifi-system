name: Build SKY WIFI APK

on:
  push:
    branches: [ main, master ]
    paths: [ 'app/**', '.github/workflows/build-apk.yml' ]
  pull_request:
    paths: [ 'app/**', '.github/workflows/build-apk.yml' ]
  workflow_dispatch:

jobs:
  build:
    name: Analyze, test and build Android APK (+ Play Store AAB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Every run gets a higher version code (Google Play needs it). The version name comes from pubspec.yaml.
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Pinned on purpose: app/android is made for Flutter 3.38.x (Gradle 8.14, AGP 8.11.1, Kotlin 2.2.20).
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.10'
          cache: true

      - name: Flutter packages
        run: flutter pub get

      - name: Analyze (errors stop the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        run: flutter test

      # Upload key from repository secrets (Settings → Secrets and variables → Actions). Not available to pull requests.
      - name: Set up release signing (Play upload key)
        id: signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::warning title=Play Store AAB skipped::Missing repository secrets:$missing. The APK is signed with a temporary debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          keytool -list -keystore "$RUNNER_TEMP/upload-keystore.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::The keystore, password or alias in the secrets is wrong."; exit 1; }
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: flutter build apk --release --build-number="$BUILD_NUMBER"

      - name: Which key signed the APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERT"
          if echo "$CERT" | grep -q "CN=Android Debug"; then
            {
              echo "### ⚠️ APK signed with a temporary debug key"
              echo ""
              echo "Uninstall the old SKY WIFI app before installing this APK. Add the 4 \`ANDROID_KEYSTORE_*\` / \`ANDROID_KEY_*\` secrets so every build uses one permanent key."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ APK signed with the permanent release key (version code $BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sky-wifi-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Play Store bundle (AAB)
        if: steps.signing.outputs.signed == 'true'
        run: flutter build appbundle --release --build-number="$BUILD_NUMBER"

      - name: Upload AAB
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sky-wifi-playstore-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks"
