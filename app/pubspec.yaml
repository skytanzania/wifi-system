name: sky_wifi
description: "SKY WIFI TANZANIA — seller app: routers, packages, vouchers, clients, payments, withdrawals, SMS and chat."
publish_to: "none"
version: 1.2.0+4

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  webview_flutter: ^4.10.0
  qr_flutter: ^4.1.0
  font_awesome_flutter: ^10.8.0
  pdf: ^3.11.3
  printing: ^5.14.2
  google_maps_flutter: ^2.12.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Same fonts as the website: Inter (text) and JetBrains Mono (voucher codes, MACs) — SIL Open Font License
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter_400Regular.ttf
        - asset: fonts/Inter_500Medium.ttf
          weight: 500
        - asset: fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: fonts/Inter_700Bold.ttf
          weight: 700
        - asset: fonts/Inter_800ExtraBold.ttf
          weight: 800
        - asset: fonts/Inter_900Black.ttf
          weight: 900
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono_500Medium.ttf
          weight: 500
        - asset: fonts/JetBrainsMono_700Bold.ttf
          weight: 700
        - asset: fonts/JetBrainsMono_800ExtraBold.ttf
          weight: 800
